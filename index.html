        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .quiz-container { background: var(--card); max-width: 800px; width: 100%; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

        .options { display: grid; gap: 10px; }

        .opt-btn.correct { background: #d4edda; border-color: var(--correct); color: #155724; }
        .opt-btn.wrong { background: #f8d7da; border-color: var(--wrong); color: #721c24; }
        .footer { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; }
        .btn-next { padding: 12px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-next:disabled { background: #ccc; }
        .stats { font-weight: bold; color: var(--accent); }
        #resultBox { display: none; text-align: center; }
    </style>
</head>

// RANDOMIZÁLÓ (SHUFFLE) FÜGGVÉNY
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

let quizData = [...rawData];
shuffle(quizData); // Véletlenszerű sorrend minden betöltésnél

let currentIdx = 0;
let score = 0;

function loadQuestion() {
    const qArea = document.getElementById('qArea');
    const q = quizData[currentIdx];
    document.getElementById('progress').innerText = `${currentIdx + 1} / ${quizData.length}`;
    document.getElementById('qText').innerText = q.q;
    
    const optArea = document.getElementById('optArea');
    optArea.innerHTML = '';
    
    q.o.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(i, btn);
        optArea.appendChild(btn);
    });
    document.getElementById('nextBtn').disabled = true;
}

function checkAnswer(selected, btn) {
    const correct = quizData[currentIdx].a;
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => b.disabled = true);
    
    if(selected === correct) {
        btn.classList.add('correct');
        score++;
        document.getElementById('score').innerText = `Pontszám: ${score}`;
    } else {
        btn.classList.add('wrong');
        btns[correct].classList.add('correct');
    }
    document.getElementById('nextBtn').disabled = false;
}

document.getElementById('nextBtn').onclick = () => {
    currentIdx++;
    if(currentIdx < quizData.length) {
        loadQuestion();
    } else {
        document.getElementById('quizBox').style.display = 'none';
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('finalScore').innerText = `${score} / ${quizData.length} pont (${Math.round(score/quizData.length*100)}%)`;
    }
};

loadQuestion();
</script>
</body>
</html>
